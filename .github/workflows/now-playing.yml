name: Update now-playing card

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-playing
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render the card from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python3 scripts/now_playing.py --user ScottDataScienc --out dist/now-playing.svg

      # The card lives on an orphan `output` branch that is rewritten every run,
      # so main stays clean and the repository does not grow. The README embeds
      # https://raw.githubusercontent.com/sminerport/sminerport/output/now-playing.svg
      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add now-playing.svg
          git commit -q -m 'chore: update now-playing card'
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
