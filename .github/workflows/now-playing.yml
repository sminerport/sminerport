name: Update now-playing card

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

# Everything that writes to the `output` branch shares this group so runs queue
# instead of overwriting each other.
concurrency:
  group: output-branch

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render the card from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python3 scripts/now_playing.py --user ScottDataScienc --out dist/now-playing.svg

      # The README embeds
      # https://raw.githubusercontent.com/sminerport/sminerport/output/now-playing.svg
      - name: Publish to the output branch
        run: |
          scripts/publish_output.sh dist 'chore: update now-playing card'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
