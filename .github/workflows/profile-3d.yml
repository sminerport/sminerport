name: Update 3D contribution graph

on:
  schedule:
    - cron: '0 0 * * *'   # nightly at 00:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution files
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # The built-in token never expires. It counts public contributions,
          # which is what visitors to the profile see anyway.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: sminerport

      - name: Commit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib
          git commit -m 'chore: update 3d contributions' || echo 'No changes'
          git push
