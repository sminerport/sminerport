name: Update 3D contribution graph

on:
  schedule:
    - cron: '0 0 * * *'   # nightly at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Everything that writes to the `output` branch shares this group so runs queue
# instead of overwriting each other.
concurrency:
  group: output-branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The graph includes private activity from the profile's contribution
      # calendar. A personal access token (secret PAT_3D) additionally lets the
      # radar and language charts see private repositories. Tokens expire, so
      # check it first and fall back to the built-in token.
      - name: Check whether PAT_3D is still valid
        id: pat
        env:
          PAT_3D: ${{ secrets.PAT_3D }}
        run: |
          if [ -n "$PAT_3D" ] && curl -sf -H "Authorization: Bearer $PAT_3D" https://api.github.com/user > /dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Using PAT_3D."
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "PAT_3D is missing or expired; using GITHUB_TOKEN."
          fi

      - name: Generate 3D contribution files
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ steps.pat.outputs.valid == 'true' && secrets.PAT_3D || secrets.GITHUB_TOKEN }}
          USERNAME: sminerport

      # The README embeds
      # https://raw.githubusercontent.com/sminerport/sminerport/output/profile-3d-contrib/<variant>.svg
      - name: Publish to the output branch
        run: |
          mkdir -p dist/profile-3d-contrib
          cp profile-3d-contrib/*.svg dist/profile-3d-contrib/
          scripts/publish_output.sh dist 'chore: update 3d contribution graph'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
